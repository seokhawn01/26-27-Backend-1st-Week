<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
<style>
  .lbl  { font-family:"Apple SD Gothic Neo","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; }
  .addr { font-size:34px; fill:#111; }
  .val  { font-size:34px; fill:#111; text-anchor:middle; }
  .fld  { font-size:22px; fill:#8a8a8a; text-anchor:middle; }
  .nm   { font-size:28px; fill:#111; text-anchor:middle; }
  .bx   { fill:none; stroke:#111; stroke-width:3.5; }
  .ar   { fill:none; stroke:#111; stroke-width:5; }
</style>
<defs>
  <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#111"/>
  </marker>
</defs>
<rect width="1000" height="1000" fill="#ffffff"/>
<defs>
  <marker id="r" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#d93025"/>
  </marker>
</defs>
<g class="lbl" transform="translate(0,150)">
  <!-- Node 0 : next 가 x04 로 바뀜 -->
  <text class="addr" x="60" y="58">x01</text>
  <rect class="bx" x="60" y="72" width="240" height="150"/>
  <rect class="bx" x="90" y="100" width="180" height="72"/>
  <line x1="180" y1="100" x2="180" y2="172" stroke="#111" stroke-width="3.5"/>
  <text class="val" x="135" y="147">"A"</text>
  <text class="val" x="225" y="147" fill="#d93025">x04</text>
  <text class="fld" x="135" y="199">item</text>
  <text class="fld" x="225" y="199">next</text>
  <text class="nm"  x="180" y="258">Node 0</text>

  <!-- Node 1 : 그대로 -->
  <text class="addr" x="700" y="58">x02</text>
  <rect class="bx" x="700" y="72" width="240" height="150"/>
  <rect class="bx" x="730" y="100" width="180" height="72"/>
  <line x1="820" y1="100" x2="820" y2="172" stroke="#111" stroke-width="3.5"/>
  <text class="val" x="775" y="147">"B"</text>
  <text class="val" x="865" y="147">x03</text>
  <text class="fld" x="775" y="199">item</text>
  <text class="fld" x="865" y="199">next</text>
  <text class="nm"  x="820" y="258">Node 1</text>

  <!-- 끊어진 기존 연결 -->
  <path fill="none" stroke="#bbbbbb" stroke-width="5" stroke-dasharray="14 12" d="M 225 100 C 300 44, 480 26, 690 46"/>
  <g stroke="#999999" stroke-width="6" stroke-linecap="round">
    <line x1="432" y1="18" x2="468" y2="54"/>
    <line x1="468" y1="18" x2="432" y2="54"/>
  </g>
  <text class="fld" x="450" y="86" fill="#999999">기존 연결</text>

  <!-- 새로 끼워넣은 노드 -->
  <text class="addr" x="380" y="400" fill="#d93025">x04</text>
  <rect x="380" y="414" width="240" height="150" fill="none" stroke="#d93025" stroke-width="3.5"/>
  <rect x="410" y="442" width="180" height="72" fill="none" stroke="#d93025" stroke-width="3.5"/>
  <line x1="500" y1="442" x2="500" y2="514" stroke="#d93025" stroke-width="3.5"/>
  <text class="val" x="455" y="489" fill="#d93025">"D"</text>
  <text class="val" x="545" y="489" fill="#d93025">x02</text>
  <text class="fld" x="455" y="541">item</text>
  <text class="fld" x="545" y="541">next</text>
  <text class="nm"  x="500" y="600" fill="#d93025">새 노드</text>

  <!-- 새 화살표 두 개 -->
  <path fill="none" stroke="#d93025" stroke-width="5" marker-end="url(#r)" d="M 270 136 C 348 196, 330 320, 372 386"/>
  <path fill="none" stroke="#d93025" stroke-width="5" marker-end="url(#r)" d="M 590 478 C 690 440, 660 170, 698 74"/>
</g>
</svg>
