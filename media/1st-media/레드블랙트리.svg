<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1140" viewBox="0 0 1140 1140">
<style>
  .lbl { font-family:"Apple SD Gothic Neo","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; }
  .val { font-size:38px; fill:#ffffff; text-anchor:middle; }
  .side{ font-size:26px; fill:#555; }
  .cap { font-size:26px; fill:#111; text-anchor:middle; }
  .bk  { fill:#111111; stroke:#111; stroke-width:3.5; }
  .rd  { fill:#d13b3b; stroke:#d13b3b; stroke-width:3.5; }
  .eg  { fill:none; stroke:#111; stroke-width:3.5; }
</style>
<rect width="1140" height="1140" fill="#ffffff"/>
<g class="lbl" transform="translate(0,245)">
  <text class="side" x="60" y="60">같은 3, 7, 9, 12, 45 를 레드블랙 트리에 넣으면</text>

  <path class="eg" d="M 570 130 L 390 320"/>
  <path class="eg" d="M 570 130 L 750 320"/>
  <path class="eg" d="M 390 320 L 250 510"/>
  <path class="eg" d="M 750 320 L 890 510"/>

  <circle class="bk" cx="570" cy="130" r="52"/>
  <circle class="bk" cx="390" cy="320" r="52"/>
  <circle class="bk" cx="750" cy="320" r="52"/>
  <circle class="rd" cx="250" cy="510" r="52"/>
  <circle class="rd" cx="890" cy="510" r="52"/>

  <text class="val" x="570" y="144">9</text>
  <text class="val" x="390" y="334">7</text>
  <text class="val" x="750" y="334">12</text>
  <text class="val" x="250" y="524">3</text>
  <text class="val" x="890" y="524">45</text>

  <text class="cap" x="570" y="630">색 규칙으로 균형을 잡아서 최악의 경우에도 O(log n)입니다</text>
</g>
</svg>
