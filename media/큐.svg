<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1140" viewBox="0 0 1140 1140">
<style>
  .lbl { font-family:"Apple SD Gothic Neo","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; }
  .mth { font-size:30px; fill:#111; text-anchor:middle; }
  .val { font-size:38px; fill:#111; text-anchor:middle; }
  .cap { font-size:26px; fill:#111; text-anchor:middle; }
  .bx  { fill:#ffffff; stroke:#111; stroke-width:3.5; }
  .wall{ fill:none; stroke:#111; stroke-width:5; }
  .ar  { fill:none; stroke:#111; stroke-width:4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#111"/>
  </marker>
</defs>
<rect width="1140" height="1140" fill="#ffffff"/>
<g class="lbl" transform="translate(0,335)">
  <line class="wall" x1="280" y1="130" x2="860" y2="130"/>
  <line class="wall" x1="280" y1="330" x2="860" y2="330"/>
  <rect class="bx" x="300" y="145" width="160" height="160" rx="14"/>
  <rect class="bx" x="480" y="145" width="160" height="160" rx="14"/>
  <rect class="bx" x="660" y="145" width="160" height="160" rx="14"/>
  <text class="val" x="380" y="238">1</text>
  <text class="val" x="560" y="238">2</text>
  <text class="val" x="740" y="238">3</text>

  <text class="mth" x="960" y="185">offer()</text>
  <path class="ar" marker-end="url(#a)" d="M 990 230 L 878 230"/>
  <text class="mth" x="200" y="185">poll()</text>
  <path class="ar" marker-end="url(#a)" d="M 262 230 L 150 230"/>

  <text class="cap" x="570" y="430">먼저 넣은 1이 가장 먼저 나옵니다</text>
</g>
</svg>
