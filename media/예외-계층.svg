<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1660" viewBox="0 0 1660 1660">
<style>
  .lbl { font-family:"Apple SD Gothic Neo","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; }
  .bx  { fill:#ffffff; stroke:#111; stroke-width:3.5; }
  .eg  { fill:none; stroke:#111; stroke-width:3; }
  .nm  { font-size:26px; fill:#111; text-anchor:middle; }
  .sub { font-size:22px; fill:#555555; text-anchor:middle; }
  .note{ font-size:20px; fill:#8a8a8a; text-anchor:middle; }
  .chk { fill:#eef4fb; stroke:#2f6fd0; stroke-width:2.5; }
  .unc { fill:#fdf0f0; stroke:#d13b3b; stroke-width:2.5; }
  .clb { font-size:24px; fill:#2f6fd0; text-anchor:middle; }
  .ulb { font-size:24px; fill:#d13b3b; text-anchor:middle; }
</style>
<rect width="1660" height="1660" fill="#ffffff"/>
<g class="lbl" transform="translate(0,480)">
  <rect class="chk" x="595" y="390" width="530" height="120" rx="18"/>
  <rect class="unc" x="1165" y="390" width="390" height="230" rx="18"/>

  <path class="eg" d="M 710 150 L 710 196"/>
  <path class="eg" d="M 380 196 L 1040 196"/>
  <path class="eg" d="M 380 196 L 380 230"/>
  <path class="eg" d="M 1040 196 L 1040 230"/>
  <path class="eg" d="M 1040 310 L 1040 372"/>
  <path class="eg" d="M 740 372 L 1340 372"/>
  <path class="eg" d="M 740 372 L 740 410"/>
  <path class="eg" d="M 1000 372 L 1000 410"/>
  <path class="eg" d="M 1340 372 L 1340 410"/>

  <rect class="bx" x="590" y="70"  width="240" height="80"/>
  <text class="nm" x="710" y="120">Throwable</text>

  <rect class="bx" x="260" y="230" width="240" height="80"/>
  <text class="nm" x="380" y="280">Error</text>
  <text class="note" x="380" y="348">잡으면 안 되는 심각한 오류</text>

  <rect class="bx" x="920" y="230" width="240" height="80"/>
  <text class="nm" x="1040" y="280">Exception</text>

  <rect class="bx" x="620" y="410" width="240" height="80"/>
  <text class="nm" x="740" y="460">IOException</text>
  <rect class="bx" x="880" y="410" width="240" height="80"/>
  <text class="nm" x="1000" y="460">SQLException</text>
  <text class="clb" x="860" y="558">체크 예외 — 반드시 처리하거나 던져야 합니다</text>

  <rect class="bx" x="1200" y="410" width="280" height="80"/>
  <text class="nm" x="1340" y="460">RuntimeException</text>
  <text class="sub" x="1360" y="540">NullPointerException</text>
  <text class="sub" x="1360" y="580">IllegalArgumentException</text>
  <text class="ulb" x="1360" y="668">언체크 예외 — 안 잡아도 컴파일 됩니다</text>
</g>
</svg>
