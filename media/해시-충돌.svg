<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1140" viewBox="0 0 1140 1140">
<style>
  .lbl { font-family:"Apple SD Gothic Neo","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; }
  .top { font-size:40px; fill:#111; text-anchor:middle; }
  .val { font-size:36px; fill:#111; text-anchor:middle; }
  .sml { font-size:28px; fill:#2f6fd0; text-anchor:middle; }
  .idx { font-size:22px; fill:#8a8a8a; text-anchor:middle; }
  .side{ font-size:26px; fill:#555; }
  .fn  { font-size:30px; fill:#777; text-anchor:middle; }
  .fm  { font-size:42px; fill:#111; text-anchor:middle; }
  .cap { font-size:26px; fill:#2f6fd0; text-anchor:middle; }
  .bx  { fill:none; stroke:#111; stroke-width:3.5; }
  .bl  { fill:none; stroke:#2f6fd0; stroke-width:3.5; }
  .dl  { fill:none; stroke:#111; stroke-width:3.5; stroke-dasharray:9 9; }
  .cv  { fill:none; stroke:#111; stroke-width:3; }
</style>
<defs>
  <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#111"/>
  </marker>
</defs>
<rect width="1140" height="1140" fill="#ffffff"/>
<g class="lbl" transform="translate(0,155)">
  <text class="side" x="60" y="112">나머지가 같은 값</text>
  <text class="top" x="480" y="112">45</text>
  <text class="top" x="700" y="112">65</text>
  <path class="dl" marker-end="url(#a)" d="M 480 132 L 480 172"/>
  <path class="dl" marker-end="url(#a)" d="M 700 132 L 700 172"/>

  <rect class="bx" x="340" y="180" width="500" height="140" rx="18" fill="#f6f6f6"/>
  <text class="fn" x="590" y="230">hashIndex()</text>
  <text class="fm" x="590" y="288">value % CAPACITY(10)</text>

  <path class="dl" marker-end="url(#a)" d="M 480 328 L 480 388"/>
  <path class="dl" marker-end="url(#a)" d="M 700 328 L 700 388"/>

  <text class="side" x="60" y="440">해시 인덱스가 같음</text>
  <text class="top" x="480" y="440">5</text>
  <text class="top" x="700" y="440">5</text>

  <path class="cv" marker-end="url(#a)" d="M 480 462 C 480 508, 600 506, 600 552"/>
  <path class="cv" marker-end="url(#a)" d="M 700 462 C 700 508, 630 506, 630 552"/>

  <rect class="bx" x="120" y="560" width="900" height="130"/>
  <line class="bx" x1="210" y1="560" x2="210" y2="690"/>
  <line class="bx" x1="300" y1="560" x2="300" y2="690"/>
  <line class="bx" x1="390" y1="560" x2="390" y2="690"/>
  <line class="bx" x1="480" y1="560" x2="480" y2="690"/>
  <line class="bx" x1="570" y1="560" x2="570" y2="690"/>
  <line class="bx" x1="660" y1="560" x2="660" y2="690"/>
  <line class="bx" x1="750" y1="560" x2="750" y2="690"/>
  <line class="bx" x1="840" y1="560" x2="840" y2="690"/>
  <line class="bx" x1="930" y1="560" x2="930" y2="690"/>

  <text class="val" x="345" y="637">12</text>
  <text class="val" x="435" y="637">3</text>
  <text class="val" x="795" y="637">7</text>

  <rect class="bl" x="570" y="560" width="90" height="130"/>
  <rect class="bl" x="578" y="572" width="74" height="52" rx="8"/>
  <rect class="bl" x="578" y="628" width="74" height="52" rx="8"/>
  <text class="sml" x="615" y="608">45</text>
  <text class="sml" x="615" y="664">65</text>

  <text class="idx" x="165" y="730">[0]</text>
  <text class="idx" x="255" y="730">[1]</text>
  <text class="idx" x="345" y="730">[2]</text>
  <text class="idx" x="435" y="730">[3]</text>
  <text class="idx" x="525" y="730">[4]</text>
  <text class="idx" x="615" y="730">[5]</text>
  <text class="idx" x="705" y="730">[6]</text>
  <text class="idx" x="795" y="730">[7]</text>
  <text class="idx" x="885" y="730">[8]</text>
  <text class="idx" x="975" y="730">[9]</text>

  <text class="cap" x="570" y="790">인덱스 5 안에 배열이 하나 더 생깁니다</text>
</g>
</svg>
