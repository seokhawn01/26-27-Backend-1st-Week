<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
<style>
  .lbl { font-family:"Apple SD Gothic Neo","Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; }
  .mth { font-size:30px; fill:#111; }
  .val { font-size:38px; fill:#111; text-anchor:middle; }
  .cap { font-size:26px; fill:#111; text-anchor:middle; }
  .bx  { fill:#ffffff; stroke:#111; stroke-width:3.5; }
  .wall{ fill:none; stroke:#111; stroke-width:5; }
  .ar  { fill:none; stroke:#111; stroke-width:4; }
</style>
<defs>
  <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 0 0 L 12 6 L 0 12 z" fill="#111"/>
  </marker>
</defs>
<rect width="1600" height="1600" fill="#ffffff"/>
<g class="lbl" transform="translate(0,570)">
  <line class="wall" x1="560" y1="110" x2="1040" y2="110"/>
  <line class="wall" x1="560" y1="310" x2="1040" y2="310"/>
  <rect class="bx" x="580" y="125" width="140" height="160" rx="14"/>
  <rect class="bx" x="730" y="125" width="140" height="160" rx="14"/>
  <rect class="bx" x="880" y="125" width="140" height="160" rx="14"/>
  <text class="val" x="650" y="218">1</text>
  <text class="val" x="800" y="218">2</text>
  <text class="val" x="950" y="218">3</text>

  <text class="mth" x="60" y="185" text-anchor="start">offerFirst()</text>
  <path class="ar" marker-end="url(#a)" d="M 300 175 L 548 175"/>
  <text class="mth" x="60" y="265" text-anchor="start">pollFirst()</text>
  <path class="ar" marker-end="url(#a)" d="M 548 255 L 300 255"/>

  <text class="mth" x="1540" y="185" text-anchor="end">offerLast()</text>
  <path class="ar" marker-end="url(#a)" d="M 1300 175 L 1052 175"/>
  <text class="mth" x="1540" y="265" text-anchor="end">pollLast()</text>
  <path class="ar" marker-end="url(#a)" d="M 1052 255 L 1300 255"/>

  <text class="cap" x="800" y="410">양쪽 끝에서 넣고 뺄 수 있어서 스택으로도, 큐로도 쓸 수 있습니다</text>
</g>
</svg>
